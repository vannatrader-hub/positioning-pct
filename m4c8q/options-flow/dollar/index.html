  <head>
    <meta charset="utf-8" />

  <body class="is-hub is-insight">
    <a class="skip" href="#content">Skip to content</a>
    
    <div class="wrap">
      <main id="content">
        <section class="vault-wall" id="vault-wall" data-state="checking" aria-labelledby="vault-wall-title">
          <div class="wall-card">
            <svg class="wall-dial" viewBox="0 0 48 48" aria-hidden="true">
              <circle class="vd-ring" cx="24" cy="24" r="22" />
              <circle class="vd-knob" cx="24" cy="24" r="14" />
              <path class="vd-pointer" d="M24 12.5 V17" />
              <circle class="vd-core" cx="24" cy="24" r="2.5" />
            </svg>
            <h1 id="vault-wall-title">Coming soon</h1>
            <p class="wall-lede" id="wall-lede">Nothing on this page yet.</p>
            <form class="wall-form" id="wall-form" novalidate>
              <div class="wall-field">
                <label class="wall-label" for="wall-email">Email</label>
                <input id="wall-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com" required />
              </div>
              <div class="wall-field" id="wall-code-field" hidden>
                <label class="wall-label" id="wall-code-label" for="wall-code">Code from your email</label>
                <input id="wall-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" />
              </div>
              <div class="wall-field" id="wall-password-field">
                <label class="wall-label" id="wall-password-label" for="wall-password">Password</label>
                <input id="wall-password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="wall-submit" id="wall-submit" type="submit">Sign in</button>
            </form>
            <p class="wall-status" id="wall-status" role="status" aria-live="polite"></p>
            <div class="wall-links">
              <button class="wall-reset" id="wall-forgot" type="button">Set or reset password</button>
              <button class="wall-reset" id="wall-reset" type="button" hidden>Start over</button>
            </div>
            <div class="wall-create">
              <span>New here?</span>
              <button class="wall-create-button" id="wall-create" type="button" disabled aria-disabled="true">Create account <span class="badge is-soon">Coming soon</span></button>
            </div>
            <a class="wall-back" href="../../"><span aria-hidden="true">←</span> Back</a>
          </div>
        </section>

        <div class="vault-account" id="vault-account" hidden>
          <span id="vault-account-email"></span>
          <button type="button" id="vault-signout">Sign out</button>
        </div>

        <template id="vault-content">
<header class="topbar">
      <div class="wrap topbar-in">
        <div class="topbar-start">
          <a class="lockup" href="../../">Desk<span class="mark">.</span></a>
          <nav class="nav" aria-label="Departments">
          <a href="../../">Desk</a>
          <a class="is-current" aria-current="page" href="../">Options Flow</a>
          <a href="../../new-today/">New Today</a>
          </nav>
        </div>
      </div>
    </header>

          <nav class="subnav" aria-label="Options Flow">
            <a class="subnav-back" href="../"><span aria-hidden="true">←</span> Options Flow</a>
            <a class="is-current" href="./" aria-current="page"><span class="conf">$$$</span> Shopping List</a>
            <a href="../spotlights/">Spotlight trades</a>
            <a href="../scorecard/">Weekly scorecard</a>
          </nav>
          <section class="page-head">
            <span class="pill">Options Flow</span>
            <h1 class="logo-head"><span class="conf">$$$</span> Shopping List</h1>
            <p class="lede">
              Names where large opening options trades lined up on one side, with the industry each one sits in. Open a
              name for its calling card: the flow, the open interest that stayed, a recommendation, and the trade levels
              on a price chart.
            </p>
            <p class="asof-line pill" id="flow-asof">Loading the Shopping List…</p>
          </section>

          <section class="desk-section flow-list-section" aria-labelledby="watchlist-title">
            <div class="section-head">
              <div class="section-title-row">
                <h2 id="watchlist-title" class="logo-head"><span class="conf">$$$</span> Shopping List</h2>
                <span class="section-count" id="flow-count"></span>
              </div>
              <p class="hint">
                <span class="conf" aria-hidden="true">$$$</span> marks the highest-confidence flow. Last three weeks,
                newest alert first. Alert times are Central (CT). Last close is from a committed daily snapshot.
              </p>
            </div>
            <div class="flow-head" aria-hidden="true">
              <span>Name</span>
              <span>Industry</span>
              <span>Flow</span>
              <span>Alerted (CT)</span>
              <span>Last close</span>
            </div>
            <ul class="flow-list" id="flow-list" aria-labelledby="watchlist-title"></ul>
          </section>

          <dialog class="cc" id="calling-card" aria-labelledby="cc-ticker" aria-describedby="cc-title">
            <div class="cc-frame">
              <header class="cc-head">
                <div class="cc-ident">
                  <h2 class="cc-ticker" id="cc-ticker"></h2>
                  <span class="conf" id="cc-conf"></span>
                  <span class="cc-name" id="cc-name"></span>
                </div>
                <button class="cc-close" type="button" id="cc-close" aria-label="Close calling card">
                  <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
                    <path d="M5 5 L15 15 M15 5 L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  </svg>
                </button>
              </header>
              <div class="cc-body">
                <section class="cc-left" aria-label="Flow">
                  <p class="cc-meta">
                    <time class="cc-alert" id="cc-alert"></time>
                    <span id="cc-meta"></span>
                  </p>
                  <h3 class="cc-title" id="cc-title"></h3>
                  <div class="cc-block">
                    <h4 class="cc-label">Flow</h4>
                    <div class="cc-flow" id="cc-flow"></div>
                  </div>
                  <div class="cc-block cc-buy" id="cc-buy-block">
                    <div class="cc-buy-head">
                      <h4 class="cc-label">Customer purchased</h4>
                      <span class="cc-side" id="cc-buy-side"></span>
                    </div>
                    <dl class="cc-oi" id="cc-buy"></dl>
                  </div>
                  <div class="cc-block" id="cc-oi-block">
                    <h4 class="cc-label">Flow in open interest</h4>
                    <dl class="cc-oi" id="cc-oi"></dl>
                  </div>
                  <div class="cc-rec">
                    <h4 class="cc-label">Recommendation</h4>
                    <p id="cc-rec"></p>
                  </div>
                </section>
                <section class="cc-right" aria-labelledby="tl-kicker">
                  <div class="tl-top">
                    <span class="tl-kicker" id="tl-kicker">Trade levels</span>
                    <span class="tl-contract" id="tl-contract"></span>
                  </div>
                  <dl class="tl-tiles" id="tl-tiles"></dl>
                  <div class="tl-panel">
                    <p class="tl-chart-head" id="tl-chart-head"></p>
                    <div class="cc-chart" id="cc-chart"></div>
                    <div class="tl-foot">
                      <span class="tl-legend" id="tl-legend"></span>
                      <span class="tl-move" id="tl-move"></span>
                    </div>
                  </div>
                  <p class="cc-chart-note" id="cc-chart-note"></p>
                </section>
              </div>
            </div>
          </dialog>
        
<footer class="site-footer">
        <div>
          <a class="lockup" href="../../">Desk<span class="mark">.</span></a>
          <p class="foot-note">Desk.</p>
        </div>
        <nav class="foot-links" aria-label="Footer">
          <a href="../../">Desk</a>
          <a class="is-current" aria-current="page" href="../">Options Flow</a>
          <a href="../../new-today/">New Today</a>
        </nav>
      </footer>
        </template>
      </main>

      
    </div>

</html>
