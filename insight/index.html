<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insight · Positioning %.</title>
    <meta
      name="description"
      content="Insight: the full desk surface for family. Positioning reads, Options Flow with Shopping List, Spotlights, and the weekly scorecard."
    />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/insight-gate.js"></script>
    <script type="module" src="/src/insight-home.js"></script>
  </head>
  <body class="is-insight">
    <a class="skip" href="#content">Skip to content</a>
    <header class="topbar">
      <div class="wrap topbar-in">
        <div class="topbar-start">
          <a class="lockup" href="../">Positioning<span class="mark">%.</span></a>
          <nav class="surface" aria-label="Surface">
            <a href="../"><i class="surface-dot" aria-hidden="true"></i>Dashboard</a>
            <a href="../vault/"><svg class="surface-dial" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.75" /><circle cx="6" cy="6" r="1.5" /></svg>Vault</a>
            <a class="is-current" href="./" aria-current="page"><svg class="surface-eye" viewBox="0 0 14 10" aria-hidden="true"><ellipse cx="7" cy="5" rx="6" ry="4.25" /><circle cx="7" cy="5" r="2" /></svg>Insight</a>
          </nav>
        </div>
        <nav class="nav" aria-label="Pages">
          <a href="positioning/">Positioning</a>
          <a href="options-flow/">Options Flow</a>
          <a href="new-today/">New Today</a>
        </nav>
      </div>
    </header>

    <div class="wrap">
      <main id="content">
        <section class="insight-wall" id="insight-wall" data-state="checking" aria-labelledby="insight-wall-title">
          <div class="wall-card">
            <svg class="wall-eye" viewBox="0 0 48 36" aria-hidden="true">
              <ellipse class="we-ring" cx="24" cy="18" rx="21" ry="15" />
              <circle class="we-iris" cx="24" cy="18" r="8" />
              <circle class="we-pupil" cx="24" cy="18" r="3.5" />
            </svg>
            <h1 id="insight-wall-title">Sign in for Insight</h1>
            <p class="wall-lede" id="wall-lede">Insight opens for family. Sign in with your email and password.</p>
            <form class="wall-form" id="wall-form" novalidate>
              <div class="wall-field">
                <label class="wall-label" for="wall-email">Email</label>
                <input id="wall-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com" required />
              </div>
              <div class="wall-field" id="wall-code-field" hidden>
                <label class="wall-label" id="wall-code-label" for="wall-code">Code from your email</label>
                <input id="wall-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" />
              </div>
              <div class="wall-field" id="wall-password-field">
                <label class="wall-label" id="wall-password-label" for="wall-password">Password</label>
                <input id="wall-password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="wall-submit" id="wall-submit" type="submit">Sign in</button>
            </form>
            <p class="wall-status" id="wall-status" role="status" aria-live="polite"></p>
            <div class="wall-links">
              <button class="wall-reset" id="wall-forgot" type="button">Set or reset password</button>
              <button class="wall-reset" id="wall-reset" type="button" hidden>Start over</button>
            </div>
            <div class="wall-create">
              <span>New to Insight?</span>
              <button class="wall-create-button" id="wall-create" type="button" disabled aria-disabled="true">Create account <span class="badge is-soon">Coming soon</span></button>
            </div>
            <a class="wall-back" href="../"><span aria-hidden="true">←</span> Back to Dashboard</a>
          </div>
        </section>

        <div class="insight-account" id="insight-account" hidden>
          <span id="insight-account-email"></span>
          <button type="button" id="insight-signout">Sign out</button>
        </div>

        <template id="insight-content">
          <section class="insight-hero">
            <div>
              <span class="pill insight-pill">
                <svg class="surface-eye" viewBox="0 0 14 10" aria-hidden="true"><ellipse cx="7" cy="5" rx="6" ry="4.25" /><circle cx="7" cy="5" r="2" /></svg>
                Family desk
              </span>
              <h1>Insight<span class="mark">.</span></h1>
              <p class="lede">
                The full desk surface for family. Everything that runs on the Desk — Positioning, Options Flow with the Shopping List and Spotlights, and the weekly scorecard.
              </p>
              <p class="insight-note">All the depth in one place, behind a quiet wall.</p>
            </div>
            <svg class="insight-dial" viewBox="0 0 200 160" aria-hidden="true">
              <ellipse class="id-ring" cx="100" cy="80" rx="90" ry="65" />
              <ellipse class="id-iris" cx="100" cy="80" rx="38" ry="38" />
              <circle class="id-pupil" cx="100" cy="80" r="14" />
            </svg>
          </section>

          <nav class="insight-dash" aria-label="Insight pages">
            <a href="positioning/"><span class="insight-dash-num">01</span><strong>Positioning</strong><span>Soft ↔ Crowded · Charts</span></a>
            <a href="options-flow/"><span class="insight-dash-num">02</span><strong>Options Flow</strong><span>Shopping List · Spotlights · Scorecard</span></a>
            <a href="new-today/"><span class="insight-dash-num">03</span><strong>New Today</strong><span>What landed this desk day</span></a>
          </nav>

          <section class="insight-section" aria-labelledby="insight-positioning-title">
            <div class="section-head">
              <div class="section-title-row">
                <h2 id="insight-positioning-title">Positioning</h2>
                <span class="section-count">Weekly reads</span>
              </div>
              <p class="hint">Four ways into the Soft ↔ Crowded desk, plus six interactive charts. The full depth of where positioning sits.</p>
            </div>
            <div class="tile-grid insight-grid">
              <a class="tile insight-tile" href="positioning/">
                <div class="tile-kicker">
                  <span class="tile-num">01</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Weekly</span>
                </div>
                <span class="tile-icon" aria-hidden="true">
                  <svg viewBox="0 0 28 28">
                    <path d="M5 4 L11 4 L8 9 Z" fill="#0b0d12" />
                    <rect x="1" y="12" width="8.4" height="10" rx="3" fill="#2f8a55" />
                    <rect x="9.8" y="12" width="8.4" height="10" rx="1.5" fill="#cdd1d8" />
                    <rect x="18.6" y="12" width="8.4" height="10" rx="3" fill="#464b54" />
                  </svg>
                </span>
                <h2>Positioning hub</h2>
                <p>
                  Four calling cards: sector Soft ↔ Crowded bars, Credit, Options &amp; Soft Vol, and the full ten-category desk.
                  Six interactive charts sit underneath.
                </p>
                <ul class="hub-facts">
                  <li>Sectors · Credit · Vol · Full desk</li>
                  <li>Six headline charts</li>
                </ul>
                <span class="open">Open Positioning <span class="arrow" aria-hidden="true">→</span></span>
              </a>
            </div>
          </section>

          <section class="insight-section" aria-labelledby="insight-flow-title">
            <div class="section-head">
              <div class="section-title-row">
                <h2 id="insight-flow-title">Options Flow</h2>
                <span class="section-count">Shopping · Spotlights · Scorecard</span>
              </div>
              <p class="hint">The full flow desk: high-confidence names on the Shopping List, Spotlight trades, and the weekly scorecard.</p>
            </div>
            <div class="tile-grid insight-grid">
              <a class="tile insight-tile" href="options-flow/">
                <div class="tile-kicker">
                  <span class="tile-num">02</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Live</span>
                </div>
                <span class="tile-icon hub-icon" aria-hidden="true"><span class="conf">$$$</span></span>
                <h2>Options Flow hub</h2>
                <p>
                  Three calling cards: the $$$ Shopping List with its names and industries, Spotlight trades with recommendations
                  and trade levels, and the weekly scorecard board.
                </p>
                <ul class="hub-facts">
                  <li>$$$ Shopping List · Spotlight trades</li>
                  <li>Weekly scorecard</li>
                </ul>
                <span class="open">Open Options Flow <span class="arrow" aria-hidden="true">→</span></span>
              </a>
            </div>
          </section>

          <section class="insight-section" aria-labelledby="insight-newtoday-title">
            <div class="section-head">
              <div class="section-title-row">
                <h2 id="insight-newtoday-title">New Today</h2>
                <span class="section-count">Desk day</span>
              </div>
              <p class="hint">Everything that landed on the Desk this desk day, newest first.</p>
            </div>
            <div class="tile-grid insight-grid">
              <a class="tile insight-tile" href="new-today/">
                <div class="tile-kicker">
                  <span class="tile-num">03</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Today</span>
                </div>
                <span class="tile-icon" aria-hidden="true">
                  <svg viewBox="0 0 28 28" fill="none" stroke-linecap="round">
                    <rect x="3" y="4" width="22" height="20" rx="3" stroke="#464b54" stroke-width="2" />
                    <path d="M3 10 H25" stroke="#464b54" stroke-width="2" />
                    <circle cx="8" cy="16" r="2" fill="#5b9cff" />
                  </svg>
                </span>
                <h2>New Today</h2>
                <p>
                  A catch-up directory of everything that landed on the Desk this desk day, grouped by section or in one flat list.
                </p>
                <ul class="hub-facts">
                  <li>Positioning · Options Flow · SPX · Research</li>
                  <li>Step back through desk days</li>
                </ul>
                <span class="open">Open New Today <span class="arrow" aria-hidden="true">→</span></span>
              </a>
            </div>
          </section>

          <section class="insight-desk" aria-labelledby="insight-dashboard-title">
            <div>
              <h2 id="insight-dashboard-title">Dashboard is always open</h2>
              <p class="hint">The public visitor surface with positioning reads, open to everyone.</p>
            </div>
            <nav class="insight-desk-links" aria-label="Dashboard pages">
              <a class="is-primary" href="../"><span aria-hidden="true">←</span> Dashboard</a>
            </nav>
          </section>
        </template>
      </main>

      <footer class="site-footer">
        <div>
          <a class="lockup" href="../">Positioning<span class="mark">%.</span></a>
          <p class="foot-note">Insight · for family.</p>
        </div>
        <nav class="foot-links" aria-label="Footer">
          <a href="../">Dashboard</a>
          <a class="is-current" href="./" aria-current="page">Insight</a>
          <a href="../vault/">Vault</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
