<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vol · Credit · Momentum · Positioning %.</title>
    <meta name="description" content="Family wall. The gauge and the longer close read stay on this page." />
    <meta name="theme-color" content="#f3f1ec" />
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem("p-theme");if(t!=="light"&&t!=="dark"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";localStorage.setItem("p-theme",t)}}catch(e){t=t==="dark"?"dark":"light"}d.dataset.theme=t})();</script>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/theme.js"></script>
    <script type="module" src="/src/hub-gate.js"></script>
    <script type="module" src="/src/vault-wall.js"></script>
    <script type="module" src="/src/vault-breadth.js"></script>
  </head>
  <body class="is-hub is-insight" data-family-entry="m4c8q">
    <a class="skip" href="#content">Skip to content</a>
    <div class="wrap is-wide">
      <main id="content">
        <section class="vault-wall" id="vault-wall" data-state="checking" aria-labelledby="vault-wall-title">
          <div class="wall-card">
            <h1 id="vault-wall-title">Coming soon</h1>
            <p class="wall-lede" id="wall-lede">Nothing on this page yet.</p>
            <form class="wall-form" id="wall-form" novalidate>
              <div class="wall-field">
                <label class="wall-label" for="wall-email">Email</label>
                <input id="wall-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="you@example.com" required />
              </div>
              <div class="wall-field" id="wall-code-field" hidden>
                <label class="wall-label" id="wall-code-label" for="wall-code">Code from your email</label>
                <input id="wall-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" />
              </div>
              <div class="wall-field" id="wall-password-field">
                <label class="wall-label" id="wall-password-label" for="wall-password">Password</label>
                <input id="wall-password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="wall-submit" id="wall-submit" type="submit">Sign in</button>
            </form>
            <p class="wall-status" id="wall-status" role="status" aria-live="polite"></p>
            <div class="wall-links">
              <button class="wall-reset" id="wall-forgot" type="button">Set or reset password</button>
              <button class="wall-reset" id="wall-reset" type="button" hidden>Start over</button>
            </div>
            <div class="wall-create">
              <span>New here?</span>
              <button class="wall-create-button" id="wall-create" type="button" disabled aria-disabled="true">Create account <span class="badge is-soon">Coming soon</span></button>
            </div>
            <a class="wall-back" href="../../"><span aria-hidden="true">←</span> Back</a>
          </div>
        </section>
        <div class="vault-account" id="vault-account" hidden>
          <span id="vault-account-email"></span>
          <button type="button" id="vault-signout">Sign out</button>
        </div>
        <template id="vault-content">
          <section class="page-head">
            <span class="pill">Desk</span>
            <h1>Vol · Credit · Momentum</h1>
            <p class="lede">The gauge and the longer close read. Hover a chart for the session.</p>
          </section>
<section class="wall-asof" aria-labelledby="wall-asof-title">
            <div class="wall-asof-head">
              <h2 id="wall-asof-title">Data as of</h2>
              <p class="hint">Committed sessions. Not a live quote.</p>
            </div>
            <div id="wall-asof">
              <p class="hint">Checking data dates…</p>
            </div>
          </section>

          <div class="wall-grid" id="wall">
            <article class="pchart svb-card" id="spot-vol-beta" aria-labelledby="svb-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">01</span>
                  <span class="basis svb-asof" id="svb-asof"></span>
                  <span class="house h-desk">Desk</span>
                </div>
                <h2 id="svb-title">Vol Stress</h2>
                <p class="wall-sub">Today's read. At or above 2, the desk watches for a possible bottom.</p>
              </header>
              <div id="svb-body">
                <p class="hint" id="svb-status">Loading Vol Stress…</p>
              </div>
            </article>

            <article class="pchart csr-card" id="credit-spread-regime" aria-labelledby="csr-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">02</span>
                  <span class="csr-asof" id="csr-asof">FRED ICE BofA OAS</span>
                  <span class="house h-desk">Desk</span>
                </div>
                <h2 id="csr-title">Credit Spread Regime</h2>
                <p class="wall-sub">How stressed credit is. Hover a session. The line is the spread, the shading is the zone.</p>
              </header>

              <div class="csr-controls">
                <div class="seg" data-seg="range" role="group" aria-label="Window">
                  <button type="button" data-range="3m" aria-pressed="false">3M</button>
                  <button type="button" data-range="6m" aria-pressed="false">6M</button>
                  <button type="button" data-range="1y" aria-pressed="false">1Y</button>
                  <button type="button" class="is-on" data-range="all" aria-pressed="true">All</button>
                </div>
                <div class="seg" data-seg="metric" role="group" aria-label="Spread">
                  <button type="button" class="is-on" data-metric="excess" aria-pressed="true">HY−IG excess</button>
                  <button type="button" data-metric="hy" aria-pressed="false">HY only</button>
                </div>
                <button type="button" class="toggle csr-spx" id="csr-spx" aria-pressed="true"><i aria-hidden="true"></i>SPX overlay</button>
              </div>

              <div class="csr-stage">
                <div class="csr-frame" id="csr-frame">
                  <div class="csr-legend" id="csr-legend" aria-hidden="true"></div>
                </div>
                <table class="csr-panel" id="csr-panel" aria-label="Credit Spread Regime statistics"></table>
                <p class="hint" id="csr-status">Loading the credit series…</p>
              </div>
              <p class="csr-help">Hover a session. Click the chart, then scroll to zoom.</p>
              <p class="visually-hidden" id="csr-live" aria-live="polite"></p>

              <div class="csr-notes">
                <div class="csr-key">
                  <span><i class="k-low" aria-hidden="true"></i>Low</span>
                  <span><i class="k-normal" aria-hidden="true"></i>Normal</span>
                  <span><i class="k-elevated" aria-hidden="true"></i>Elevated</span>
                  <span><i class="k-stress" aria-hidden="true"></i>Stress</span>
                  <span><i class="k-dot" aria-hidden="true"></i>Stress rolling over</span>
                  <span><i class="k-cross" aria-hidden="true"></i>Calm turning up</span>
                </div>
                <p class="csr-source">Source: Desk · Positioning %</p>
              </div>
            </article>

            <article class="pchart is-wide mo-card" id="mag7" aria-labelledby="mag7-title">
              <header class="pchart-head mo-head">
                <div class="tile-kicker">
                  <span class="tile-num">03</span>
                  <span class="house h-desk">Desk</span>
                </div>
                <h2 id="mag7-title">MAG7 Oscillator</h2>
                <p class="mo-sub">Are the seven biggest stocks pulling the market up or dragging it down? Hover a session.</p>
              </header>

              <div class="pchart-controls" id="mo-controls"></div>

              <div class="mo-pane" id="mo-pane">
                <div class="mo-plot" id="mo-plot"></div>
                <p class="mo-legend" id="mo-legend" aria-live="off"><span class="mo-legend-name">MAG7</span></p>
                <table class="mo-table" id="mo-table" aria-label="MAG7 Oscillator, latest bar"></table>
                <p class="mo-status" id="mo-status">Loading the oscillator…</p>
              </div>

              <div class="legend mo-key" id="mo-key">
                <span><i class="sw" style="background: #4caf50"></i><b data-key="bull">Bullish above +2</b></span>
                <span><i class="sw" style="background: #2196f3"></i>Neutral</span>
                <span><i class="sw" style="background: #ff5252"></i><b data-key="bear">Bearish below −2</b></span>
                <span data-key="caution"><i class="mo-dash is-caution"></i>Caution +9</span>
                <span data-key="stretched"><i class="mo-dash is-stretched"></i>Stretched −5</span>
              </div>

              <footer class="pchart-foot mo-foot">
                <div class="pchart-notes">
                  <p class="mo-now" id="mo-now"></p>
                  <p class="basis mo-basis" id="mo-basis"></p>
                </div>
              </footer>
            </article>

            <article class="pchart is-wide bw-card" id="nysi" data-breadth="nysi" aria-labelledby="nysi-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">04</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Daily close</span>
                </div>
                <h2 id="nysi-title">NY Summation</h2>
              </header>
              <p class="hint bw-load">Loading NY Summation…</p>
            </article>

            <article class="pchart is-wide bw-card" id="nasi" data-breadth="nasi" aria-labelledby="nasi-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">05</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Daily close</span>
                </div>
                <h2 id="nasi-title">Nasdaq Summation</h2>
              </header>
              <p class="hint bw-load">Loading Nasdaq Summation…</p>
            </article>

            <article class="pchart is-wide bw-card" id="nyhl" data-breadth="nyhl" data-months="60" aria-labelledby="nyhl-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">06</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Daily close</span>
                </div>
                <h2 id="nyhl-title">NY Highs − Lows</h2>
                <p class="wall-sub">Cumulative new highs minus new lows, with a 50-session average. Green is a cross above. Red is a cross below.</p>
              </header>
              <p class="hint bw-load">Loading NY Highs − Lows…</p>
            </article>

            <article class="pchart is-wide bw-card" id="nyad" data-breadth="nyad" data-months="36" aria-labelledby="nyad-title">
              <header class="pchart-head">
                <div class="tile-kicker">
                  <span class="tile-num">07</span>
                  <span class="badge is-live"><i aria-hidden="true"></i>Daily close</span>
                </div>
                <h2 id="nyad-title">NY Advance − Decline</h2>
                <p class="wall-sub">Cumulative advances minus declines, with an 89-session average. Green is a cross above. Red is a cross below.</p>
              </header>
              <p class="hint bw-load">Loading NY Advance − Decline…</p>
            </article>
          </div>

        </template>
      </main>
    </div>
  </body>
</html>
